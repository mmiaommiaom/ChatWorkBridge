name: Bug report / 问题反馈
description: Report a reproducible problem without sharing account or task data.
body:
  - type: input
    id: version
    attributes:
      label: ChatWorkBridge version / 版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows, Chrome and WorkBuddy versions / 使用环境
      description: Include application versions and setup/portable/source installation type. Do not include account information.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected result / 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      description: Remove tokens, signed URLs, private conversation text and local profile paths from any examples or screenshots.
    validations:
      required: true
