<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT × WorkBuddy 协作台</title>
<style>body{font:16px/1.6 system-ui;background:#f3f5f7;color:#172332;margin:0}main{max-width:900px;margin:36px auto;padding:24px}section{background:white;padding:24px;border:1px solid #dce2e8;border-radius:16px;margin:18px 0}h1{font-size:28px}h2{font-size:19px}textarea{box-sizing:border-box;width:100%;min-height:140px;font:inherit;border:1px solid #b9c6d2;border-radius:10px;padding:12px}button{font:inherit;border:0;border-radius:8px;background:#2057c4;color:white;padding:10px 18px;cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#e8edf4;color:#24374d}small{color:#586b7b}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 system-ui}article{border-top:1px solid #e1e6ed;padding:14px 0}.badge{font-weight:600;color:#2057c4}a{color:#2057c4}#notice{min-height:26px}</style>
<main><h1>GPT × WorkBuddy 协作台</h1><small>GPT 派工 · WorkBuddy 执行 · GPT 检查与返工</small>
<section><h2 id="task-heading">开始任务</h2><p id="runtime-status"></p><textarea id="goal" placeholder="输入希望两边协作完成的文字任务"></textarea><p><small>最多执行 3 轮。接入日常模式后沿用你已有的 MCP、Skill 和正常工具权限；仍需遵守不写 C 盘及付费模型先申请的规则。</small></p><button id="start">开始任务</button><button class="secondary" id="pause">当前回复结束后暂停</button><p id="notice" role="status"></p></section>
<section><h2>任务与结果</h2><div id="runs">读取中…</div></section><section><h2>执行进度</h2><pre id="output">暂无任务</pre></section>
<section><h2>模型规则</h2><p>允许：DeepSeek V4.1 Flash、HY3、Step 5 Preview。其他模型需要你批准。剩余额度未知；检测到额度耗尽后跳过该模型。结果不确定或已产生操作时停止自动重发。</p><pre id="models"></pre></section></main>
<script>function prettySummary(s){try{const v=JSON.parse(s),r=v.finalResults||v;if(r.sum!==undefined&&r.sumOfSquares!==undefined)return '总和：'+r.sum+'\n平方和：'+r.sumOfSquares+'\n独立核对：通过';return JSON.stringify(v,null,2)}catch{return s}}const token='__TOKEN__';let lastRunsHash='';const labels={prepared:'准备中',waiting_gpt:'GPT 正在检查',waiting_workbuddy:'WorkBuddy 正在执行',done:'已完成',paused:'已暂停',uncertain:'结果待核验',failed:'失败',cancelled:'已结束',needs_user:'需要你补充信息'};async function post(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Bridge-Token':token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);return j}function notice(t){document.getElementById('notice').textContent=t}document.getElementById('start').onclick=async()=>{try{await post('/api/start',{goal:document.getElementById('goal').value});notice('任务已开始')}catch(e){notice(e.message)}};document.getElementById('pause').onclick=async()=>{try{notice((await post('/api/pause')).message)}catch(e){notice(e.message)}};async function refresh(){try{const s=await(await fetch('/api/status')).json();document.getElementById('runtime-status').textContent=s.runtime==='normal'?'当前：日常 WorkBuddy，已复用原配置。':'当前：独立测试配置。接入日常配置请参阅安装说明，保存并退出 WorkBuddy 后使用日常启动入口。';document.getElementById('output').textContent=(s.output||'暂无运行中的任务').split('\n').filter(line=>!/ExperimentalWarning|Use .node --trace-warnings/.test(line)).join('\n');document.getElementById('models').textContent=Object.entries(s.models).map(([m,v])=>m+'：'+(v.quotaExhausted?'额度耗尽，已跳过':v.lastError?'最近异常：'+({service_error:'服务暂时出错',rate_limited:'请求限流',quota_exhausted:'额度耗尽',uncertain:'结果待核验',auth_or_permission:'需要检查登录或权限'}[v.lastError.category]||v.lastError.category):'已成功调用')+'；成功 '+(v.successes||0)+' 次，失败 '+(v.failures||0)+' 次').join('\n');const runsHash=JSON.stringify(s.runs);if(runsHash===lastRunsHash)return;lastRunsHash=runsHash;const root=document.getElementById('runs');root.replaceChildren();for(const r of s.runs.slice(0,8)){const a=document.createElement('article');const state=document.createElement('span');state.className='badge';state.textContent=labels[r.state]||r.state;a.append(state);const goal=document.createElement('p');goal.textContent=r.goal;a.append(goal);if(r.summary||r.error){const p=document.createElement('pre');p.textContent=prettySummary(r.summary||r.error);a.append(p)}if(r.gptUrl){const link=document.createElement('a');link.href=r.gptUrl;link.target='_blank';link.textContent='查看 GPT 聊天';a.append(link)}if(r.state==='paused'){const b=document.createElement('button');b.textContent='继续此任务';b.onclick=async()=>{try{await post('/api/resume',{runId:r.id});notice('已从保存的结果继续')}catch(e){notice(e.message)}};a.append(b)}root.append(a)}}catch(e){notice('界面连接中断，请检查启动窗口')}}refresh();setInterval(refresh,2000);</script></html>
